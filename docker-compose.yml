version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      # A variável DATABASE_URL deve ser configurada no seu Easypanel ou `.env`
      # Exemplo: DATABASE_URL=postgresql://postgres:suasenha@31.97.251.104:5432/gestao-gpu?schema=public
      - PORT=3000
    expose:
      - "3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    expose:
      - "80"
    depends_on:
      - backend
