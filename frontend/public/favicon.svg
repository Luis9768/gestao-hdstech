<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Fundo Dark Elegante estilo Linear / Vercel -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e14"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    
    <!-- Gradiente Tecnológico Cyan / Blue HDSTEC -->
    <linearGradient id="techBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Gradiente dos Pilares do H -->
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Brilho Glow Suave -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#00f2fe" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="url(#techBorder)" stroke-width="2.2"/>

  <!-- Grid Tech Discreto de Fundo -->
  <path d="M12 32h40M32 12v40" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Logo HDSTEC Monograma 'H' Futurista -->
  <!-- Pilar Esquerdo -->
  <rect x="14" y="16" width="9" height="32" rx="2.5" fill="url(#letterGrad)"/>
  
  <!-- Pilar Direito -->
  <rect x="41" y="16" width="9" height="32" rx="2.5" fill="url(#letterGrad)"/>

  <!-- Barra Central Conectora com Ângulo Tech e Glow Elétrico -->
  <path d="M23 27.5 h18 v9 h-18 z" fill="url(#techBorder)" filter="url(#cyanGlow)"/>
  
  <!-- Núcleo Central de Conexão / Chip Core -->
  <rect x="29" y="29.5" width="6" height="5" rx="1.5" fill="#ffffff"/>
</svg>
